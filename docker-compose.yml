version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"  # Map port 8000
    volumes:
      - .:/app       # Bind mount the entire project for live updates
      - db-data:/db.sqlite3  # Persist SQLite database file
    environment:
      - DEBUG=True   # Development mode
volumes:
  db-data:
